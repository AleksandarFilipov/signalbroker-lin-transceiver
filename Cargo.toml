[package]
name = "signalbroker-lin-transceiver-rp"
version = "0.1.0"
authors = ["Niclas Lind <niclas.lind@volvocars.com>, Niklas Hedlund <niklas.hedlund@volvocars.com>"]
edition = "2018"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.4.3"
lin-bus = "0.3.1"
serde_derive = "1.0.130"
serde = "1.0.130"
serialport = { version = "4.0.1", default-features = false }
tokio = { version = "1.11.0", features = ["full"] }
toml = "0.5.8"
tracing = "0.1.28"
